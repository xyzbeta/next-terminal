debug: true
demo: false
db: sqlite
mysql:
  hostname: localhost
  port: 3306
  username: next-terminal
  password: next-terminal
  database: next-terminal
sqlite:
  file: './data/sqlite/next-terminal.db'

# 数据加密密钥（资产/凭据的密码、私钥、passphrase）。生产环境必须设置，
# 留空会回退为内置默认密钥并打印告警。更换需用 --new-encryption-key 迁移。
# encryption-key: ''

server:
  addr: 0.0.0.0:8088
  # 反代部署时填代理所在网段；直连部署留空（留空即忽略 X-Forwarded-For）
  # trusted-proxies:
  #   - 10.0.0.0/8

guacd:
  hostname: 127.0.0.1
  port: 4822
  # 此路径需要为绝对路径，并且next-terminal和guacd都能访问到
  recording: 'data/recording'
  # 此路径需要为绝对路径，并且next-terminal和guacd都能访问到
  drive: 'data/drive'

sshd:
  enable: true
  addr: 0.0.0.0:8089
  key: ~/.ssh/id_rsa